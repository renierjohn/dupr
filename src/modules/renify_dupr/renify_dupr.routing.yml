renify_dupr.dupr.config:
  path: '/admin/config/system/dupr/login'
  defaults:
    _title: 'DUPR Config'
    _form: 'Drupal\renify_dupr\Form\DUPRloginConfigForm'
  requirements:
    _permission: 'administer site configuration'

renify_dupr.search:
  path: '/api/v1/dupr/search'
  defaults:
    _controller: '\Drupal\renify_dupr\Controller\DUPRsearchController::search'
  requirements:
    _permission: 'access content'
