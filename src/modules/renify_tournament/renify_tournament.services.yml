services:
  renify_tournament.csv_processor:
    class: Drupal\renify_tournament\Service\CsvPairingProcessor
    arguments: ['@entity_type.manager', '@database']
  renify_tournament.match_generator:
    class: Drupal\renify_tournament\Service\MatchGenerator
    arguments: ['@entity_type.manager']
  renify_tournament.score_generator:
    class: Drupal\renify_tournament\Service\ScoreGeneratorService
    arguments: ['@entity_type.manager']
  renify_tournament.reset_match:
    class: Drupal\renify_tournament\Service\ResetMatchService
    arguments: ['@entity_type.manager']
