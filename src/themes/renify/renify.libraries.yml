# Main theme library.
global:
  version: 1.0.1
  js:
    js/renify.js: {}
  dependencies:
    - core/once
    - core/drupal
    - core/jquery
  css:
    theme:
      css/global.css: {} # This is where your compiled SASS will live

fontawesome-cdn:
  remote: https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1
  license:
    name: MIT
    url: https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/LICENSE.txt
    gpl-compatible: true
  css:
    theme:
      https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css: { type: external, minified: true }
