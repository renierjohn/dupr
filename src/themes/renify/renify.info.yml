name: Renify
type: theme
base theme: olivero
description: A flexible theme with a responsive, mobile-first layout.
package: renify
core_version_requirement: ^10 || ^11
version: '1.0.2'
libraries:
  - renify/global
  - renify/fontawesome-cdn
regions:
  header: 'Header'
  primary_menu: 'Primary menu'
  secondary_menu: 'Secondary menu'
  page_top: 'Page top'
  page_bottom: 'Page bottom'
  featured: 'Featured'
  breadcrumb: 'Breadcrumb'
  content: 'Content'
  sidebar: 'Sidebar'
  footer_top: 'Footer Top'
  footer_bottom: 'Footer Bottom'

# libraries-override:
  # olivero/global-styling: false
  # olivero/pager: false
  # olivero/feed: false
  # olivero/node: false
  # olivero/comments: false
  # olivero/search-results: false
  # olivero/site-header: false
  # olivero/olivero.table: false

libraries-override:
  # We keep these true to maintain the Olivero layout/grid
  olivero/global-styling:
    css:
      theme:
        css/base/fonts.css: false
        css/base/base.css: false
        css/components/button.css: false
